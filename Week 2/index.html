<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Week 2 Exercises</title>
        
    </head>
    <body>
        <table id="table-of-users">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Admin</th>
                    <th>Image</th>
                </tr>
            </thead>
            <tbody id="tou-body">

            </tbody>
        </table>

        <div id="inputForm">
            <input type="text" id="input-username" placeholder="Enter username">
            <input type="email" id="input-email" placeholder="Enter email">
            <input type="checkbox" id="input-admin">
            <input type="file" id="input-image" accept="image/*">
            <button id="submit-data">Add User</button>
        </div>
        <button id="empty-table">Clear Table</button>
        <script src="script.js" defer></script>
    </body>
</html>
